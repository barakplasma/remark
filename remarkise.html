<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Remarkise">
  <meta name="description" content="Render your markdown as remark slides, in real time">
  <title>Remarkise</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

  <style>
    /* ── Slide presentation fonts (applied once remark takes over) ── */
    .remark-slide-content { font-family: 'DM Sans', sans-serif; }
    .remark-slide-content h1,
    .remark-slide-content h2,
    .remark-slide-content h3 { font-family: 'Syne', sans-serif; font-weight: 700; }
    .remark-code,
    .remark-inline-code { font-family: 'DM Mono', monospace; }

    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #141720;
      --surface2:  #1c2030;
      --border:    #2a2f45;
      --accent:    #e8543a;
      --accent2:   #f5a97f;
      --text:      #e2e4ed;
      --muted:     #6b7394;
      --success:   #3dd68c;
      --radius:    12px;
      --mono:      'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
    }

    /* ── Layout ── */
    #front-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      /* subtle grid texture */
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center center;
    }

    /* Radial vignette over the grid */
    #front-page::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 30%, var(--bg) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 3.5rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;
      animation: rise .5s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logotype ── */
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 2.8rem;
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: .25rem;
    }
    .logo span { color: var(--accent); }

    .tagline {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      letter-spacing: .01em;
    }
    .tagline a { color: var(--accent2); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .2s; }
    .tagline a:hover { border-color: var(--accent2); }

    /* ── Status message ── */
    #message {
      font-size: .85rem;
      color: var(--muted);
      min-height: 1.2em;
      margin-bottom: 1.25rem;
      font-style: italic;
      transition: color .2s;
    }
    #message.error { color: var(--accent); font-style: normal; }
    #message a { color: inherit; }

    /* ── URL row ── */
    .url-row {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .65rem 1rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: .8rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232,84,58,.15);
    }
    input[type="text"]:disabled { opacity: .4; cursor: not-allowed; }

    button.go-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: var(--mono);
      font-size: 1rem;
      padding: .65rem .9rem;
      cursor: pointer;
      transition: background .2s, transform .1s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    button.go-btn:hover  { background: #f06448; }
    button.go-btn:active { transform: scale(.95); }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Drop zone ── */
    #drop-area {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      cursor: pointer;
      transition: border-color .2s, background .2s, color .2s;
      position: relative;
    }
    #drop-area.hovering {
      border-color: var(--accent);
      background: rgba(232,84,58,.06);
      color: var(--accent2);
    }
    #drop-area.hidden { display: none; }

    .drop-icon {
      display: block;
      font-size: 1.8rem;
      margin-bottom: .6rem;
      opacity: .5;
      transition: opacity .2s, transform .2s;
    }
    #drop-area.hovering .drop-icon { opacity: 1; transform: translateY(-3px); }

    /* ── File pick button ── */
    #file-input { display: none; }

    label[for="file-input"] {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-top: 1rem;
      padding: .6rem 1.4rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .82rem;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
      font-family: var(--mono);
    }
    label[for="file-input"]:hover {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(245,169,127,.06);
    }

    /* ── Footer chips ── */
    .footer {
      margin-top: 2rem;
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      font-family: var(--mono);
      font-size: .7rem;
      padding: .25rem .7rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── Loading spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }
  </style>
</head>
<body>

<div id="front-page">
  <div class="card">
    <div class="logo">Remark<span>ise</span></div>
    <p class="tagline">
      Render <a href="https://commonmark.org/">markdown</a> as
      <a href="https://github.com/gnab/remark">remark</a> slides — in real time
    </p>

    <div id="message"></div>

    <div class="url-row">
      <input type="text" id="url" placeholder="https://…/slides.md" autocomplete="off" spellcheck="false" />
      <button class="go-btn" id="go-btn" title="Load">↵</button>
    </div>

    <div class="divider">or</div>

    <div id="drop-area">
      <span class="drop-icon">⬆</span>
      Drop a <code>.md</code> file here
      <br>
      <label for="file-input">📂 Choose file…</label>
      <input type="file" id="file-input" accept=".md,.txt,.markdown">
    </div>

    <div class="footer">
      <span class="chip">.md</span>
      <span class="chip">.txt</span>
      <span class="chip">drag &amp; drop</span>
      <span class="chip">url</span>
    </div>
  </div>
</div>

<script src="https://remarkjs.com/downloads/remark-latest.min.js"></script>
<script>
'use strict';

(function () {

  var FIXES = [
    {
      message: "Fetching raw GitHub version…",
      patterns: [
        [/\/\/(www\.)?github\.com\//i, '//raw.githubusercontent.com/'],
        [/\/blob\//i, '/']
      ]
    },
    {
      message: "Trying via RawGit…",
      patterns: [
        [/\/\/raw\.githubusercontent\.com\//i, '//rawgit.com/']
      ]
    }
  ];

  var CSS_RE    = /<style[^>]*>[^<]*<\/style>/ig;
  var URL_PAT   = /^(file|https?):\/\/.+/i;

  var frontPage = document.getElementById('front-page');
  var msgEl     = document.getElementById('message');
  var urlInput  = document.getElementById('url');
  var goBtn     = document.getElementById('go-btn');
  var dropArea  = document.getElementById('drop-area');
  var fileInput = document.getElementById('file-input');

  // ── Helpers ──────────────────────────────────────────────────

  function setMessage(html, isError) {
    msgEl.innerHTML = html;
    msgEl.className = isError ? 'error' : '';
  }

  function setLoading(loading) {
    if (loading) {
      goBtn.innerHTML = '<span class="spinner"></span>';
      goBtn.disabled = true;
      urlInput.disabled = true;
    } else {
      goBtn.innerHTML = '↵';
      goBtn.disabled = false;
      urlInput.disabled = false;
    }
  }

  function getOrigin(url) {
    var a = document.createElement('a');
    a.href = url;
    return a.origin;
  }

  // ── Presentation loader ───────────────────────────────────────

  function createPresentationFromText(data) {
    frontPage.style.display = 'none';
    var css = data.match(CSS_RE);
    if (css) {
      data = data.replace(CSS_RE, '');
      css.forEach(function (s) {
        document.head.insertAdjacentHTML('beforeend', s);
      });
    }
    remark.create({ source: data });
  }

  // ── URL fetch with auto-fix ───────────────────────────────────

  var nextFix = 0;

  function remarkise(url) {
    setLoading(true);
    setMessage('<span class="spinner"></span> Fetching markdown…');

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (data) {
        if (window.location.origin.toLowerCase() !== getOrigin(url).toLowerCase()) {
          setMessage('Cross-origin error. <a href="https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy">Same-origin policy</a> violation.', true);
          setLoading(false);
          return;
        }
        var params = new URLSearchParams(window.location.search);
        if (!params.get('url')) {
          history.pushState({}, '', '?' + new URLSearchParams({ url: url }));
        }
        createPresentationFromText(data);
      })
      .catch(function () {
        // Try fixes
        if (nextFix < FIXES.length) {
          var fix = FIXES[nextFix];
          var newUrl = url;
          fix.patterns.forEach(function (p) { newUrl = newUrl.replace(p[0], p[1]); });
          if (newUrl.toLowerCase() !== url.toLowerCase()) {
            setMessage(fix.message);
            nextFix++;
            remarkise(newUrl);
            return;
          }
          nextFix++;
        }
        var sameOrigin = window.location.origin.toLowerCase() === getOrigin(url).toLowerCase();
        setMessage(sameOrigin
          ? 'Could not load that URL.'
          : 'Error — possibly a <a href="https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy">same-origin</a> issue.',
          true);
        setLoading(false);
        nextFix = 0;
        urlInput.value = '';
      });
  }

  // ── URL input trigger ─────────────────────────────────────────

  function triggerUrl() {
    var val = urlInput.value.trim();
    if (URL_PAT.test(val)) {
      remarkise(val);
    } else {
      setMessage('That doesn\'t look like a valid URL.', true);
    }
  }

  goBtn.addEventListener('click', triggerUrl);
  urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') triggerUrl();
  });

  // ── Check for ?url= on load ───────────────────────────────────

  var params = new URLSearchParams(window.location.search);
  var initialUrl = params.get('url');
  if (initialUrl) {
    urlInput.value = decodeURIComponent(initialUrl);
    remarkise(decodeURIComponent(initialUrl));
  }

  // ── File input (works on Android) ────────────────────────────

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onloadend = function () { createPresentationFromText(reader.result); };
    reader.readAsText(file);
  });

  // ── Drag and drop ─────────────────────────────────────────────

  if (typeof window.FileReader === 'undefined') {
    dropArea.classList.add('hidden');
  }

  dropArea.addEventListener('dragover', function (e) {
    e.preventDefault();
    dropArea.classList.add('hovering');
  });

  dropArea.addEventListener('dragleave', function () {
    dropArea.classList.remove('hovering');
  });

  dropArea.addEventListener('drop', function (e) {
    e.preventDefault();
    e.stopPropagation();
    dropArea.classList.remove('hovering');
    var file = e.dataTransfer.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onloadend = function () { createPresentationFromText(reader.result); };
    reader.readAsText(file);
  });

})();
</script>
</body>
</html>
